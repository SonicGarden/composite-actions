name: 'PR Story (publish)'
description: 'generate が作った story.json を検証・render し、PR の sticky コメントとして投稿・更新する'

# generate action が artifact に置いた story.json を検証し、PR の sticky コメントとして
# 投稿・更新する composite action。Claude を動かさない書き込み専用ジョブで使う
# (generate は読み取り専用ジョブで使う)。
#
# 必要な権限: contents: read / pull-requests: write(呼び出し側 job の permissions で与える)。
# PR へのコメント(issues comments API)の書き込みは pull-requests: write だけで足りる。
# ラベルは使わないので issues: write は付けない。このジョブでは Claude を動かさないので、
# 書き込み権限を信頼できないテキストの読み手に渡すことにはならない。
#
# NOTE: checkout は不要。diff はスクリプトが gh pr diff -R で取るので、ローカルの git は不要。
#       PR のコードを一切チェックアウトせずに書き込み権限を使う形になり、権限分離としても素直になる。
inputs:
  pr_number:
    description: '対象 PR の番号（generate の pr_number output）'
    required: true
  head_sha:
    description: '対象 PR の head SHA（generate の head_sha output）'
    required: true

runs:
  using: 'composite'
  steps:
    # composite の required: true は実行時に強制されないため、必須の値は明示的に検証する
    - name: Validate inputs
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        for name in PR_NUMBER HEAD_SHA; do
          if [ -z "${!name}" ]; then
            echo "input is required but empty: ${name}" >&2
            exit 1
          fi
        done

    # NOTE: pin SHA は generate/action.yml の同じ pin と必ず同期すること。Dependabot の管理外
    #       (gh skill install --pin を見ない)なので手動で更新する。更新時は SKILL.md の
    #       allowed-tools と generate の --allowedTools が一致しているかを必ず確認する。
    - name: Install pr-story skill
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh --version
        gh skill install aki77/skills github/pr-story --agent claude-code --scope user --pin 7fb5a93f347bf780459b2cf68ac00369ce3cb422 --force
        script="$HOME/.claude/skills/pr-story/scripts/pr-story.mjs"
        test -f "$script"
        echo "script=${script}" >> "$GITHUB_OUTPUT"

    # NOTE: artifact 名 pr-story-${{ github.run_id }} は generate/action.yml の Upload story.json と
    #       必ず一致させること。
    - name: Download story.json
      uses: actions/download-artifact@v8
      with:
        name: pr-story-${{ github.run_id }}
        path: ${{ runner.temp }}/story-artifact

    # WARNING: artifact に含まれるファイルは実行しない。実行するのは pin したスキルのスクリプトだけにする。
    #          artifact からは story.json をデータとして読むだけにし、prep.json・diff・投稿先は
    #          ここで prep から作り直す。
    # NOTE: PR は URL で指定する。checkout していないので、番号だけだと gh pr view がリポジトリを
    #       解決できないため。
    # NOTE: prep は作業ディレクトリの story.json を削除するので、story.json は必ず prep の後に置く。
    # NOTE: head が generate の head_sha と違う場合は、push が重なったケース。新しい run が処理するので
    #       警告だけ出して正常終了する。
    # NOTE: 1 つの run: にまとめているのは、スクリプトの JSON 出力から取り出した dir / head を
    #       シェル変数のまま扱い、${{ }} 展開や $GITHUB_OUTPUT を経由させないため。
    #       head 移動の再検査・既存コメントの PATCH と新規 POST の切り替えは post が行う。
    - name: Validate, render and post
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCRIPT: ${{ steps.install.outputs.script }}
        PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        STORY_JSON: ${{ runner.temp }}/story-artifact/story.json
      run: |
        set -euo pipefail
        prep=$(node "$SCRIPT" prep "$PR_URL")
        dir=$(jq -r .dir <<< "$prep")
        head=$(jq -r .head <<< "$prep")
        if [[ "$head" != "$HEAD_SHA" ]]; then
          echo "::warning::generate の後に PR の head が動きました(${HEAD_SHA:0:7} -> ${head:0:7})。新しい run に任せて投稿しません。"
          exit 0
        fi
        cp "$STORY_JSON" "$dir/story.json"
        node "$SCRIPT" validate --dir "$dir"
        node "$SCRIPT" render --dir "$dir"
        node "$SCRIPT" post --dir "$dir"
